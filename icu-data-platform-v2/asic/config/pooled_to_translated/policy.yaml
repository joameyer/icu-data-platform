hospital_specific_semantic_splits:
  uk00_vt_per_ideal_bw_total:
    table: dynamic
    source_column: individuelles_Tidalvolumen_pro_kg_idealem_Koerpergewicht
    base_target_name: vt_per_kg_ideal_body_weight
    new_target_name: vt_per_ideal_bw_total
    selected_hospital_codes: [0]
    status: approved_semantic_split
    action: move_selected_hospital_values
    reason: >-
      UK00 values are predominantly on an absolute-volume-like scale
      (approximately 200-700 mL) and mostly match 6 times predicted body
      weight, rather than representing a per-kg measure. Move them to a
      separately named field without changing values. Retain the original
      per-kg target for all other hospitals; exact provenance remains
      unresolved.

