policy_version: '1.3'
status: approved_for_pooled_to_translated
source_contract_version: '1.2'
documentation: asic/docs/pooled_to_translated.md

rules:
  preserve_every_source_row: true
  coalesce_only_approved_merge_groups: true
  fail_on_unresolved_nonmissing_merge_conflict: true
  drop_only_after_all_missing_check: true
  recode_only_approved_categorical_values: true
  fail_on_unmapped_nonmissing_approved_categorical_value: true
  apply_approved_categorical_missing_sentinels: true
  apply_approved_numeric_missing_sentinels: true
  apply_approved_hospital_specific_semantic_splits: true
  translated_names_are_unique_within_table: true
  translated_names_use_english_snake_case: true
  derived_columns_are_additive: true
  apply_value_recoding: true
  apply_unit_correction: false
  apply_invalid_value_masking: false

