categorical_value_mappings:
  static:
    sex:
      status: approved_mapping
      normalization: strip_upper
      output_arrow_type: large_string
      values:
        M: male
        W: female
    weight_group:
      status: approved_mapping
      normalization: strip
      output_arrow_type: large_string
      values:
        '<65': '<65'
        '65-75': '65-75'
        '76-250': '76-250'
        '-1': null
    bmi_group:
      status: approved_mapping
      normalization: strip_upper
      output_arrow_type: large_string
      values:
        L: underweight
        M: normal_weight
        P: overweight
        '1': obesity_class_1
        '2': obesity_class_2
        '3': obesity_class_3
        X: null
        NAN: null
    discharge_status:
      status: approved_mapping
      normalization: strip_lower
      output_arrow_type: large_string
      values:
        verlegt: transferred
        verstorben: died
    death_status:
      status: approved_mapping
      normalization: strip_upper
      output_arrow_type: large_string
      values:
        '0': discharged_alive
        ICU: died_in_icu
        KH: died_in_hospital
        NAN: null
    hospital_mortality_reported:
      status: approved_mapping
      normalization: strip_lower
      output_arrow_type: boolean
      values:
        'false': false
        'true': true
  dynamic: {}

numeric_missing_sentinels:
  static:
    hosp_los:
      status: approved_missing_sentinel
      values: [-1]
      reason: >-
        Negative hospital length of stay is impossible. The production audit
        found 5,164 occurrences, all at UK08, where -1 encodes unavailable
        hospital length of stay.
    dialysis_free_days:
      status: approved_missing_sentinel
      values: [-1]
      reason: Negative free-day counts are impossible; -1 encodes missing data.
    vent_free_days:
      status: approved_missing_sentinel
      values: [-1]
      reason: Negative free-day counts are impossible; -1 encodes missing data.
  dynamic: {}

semantic_review_required:
  static:
    Zeit_seit_Studienbeginn: unit and exact definition unknown
    Phase: ASIC implementation-phase code meanings remain undocumented; preserve 0/1/2
    Cluster-ID: relationship to hospital and study design requires confirmation
    Sterblichkeit: source concept retained; approved downstream mortality consolidation is separate
    KH-Sterblichkeit: source concept retained; approved downstream mortality consolidation is separate
  dynamic:
    ARDS_Diagnose_App: application-derived meaning and codes require confirmation
    LesebestaetigungSchweregrad: meaning and encoding require confirmation
    LesebestaetigungTherapie_utc: meaning and apparent numeric encoding require confirmation
    SOFA: unspecified score source; keep separate
    'Organversagen:_SOFA_Score_ohne_GCS': score explicitly excludes GCS; keep separate
    SOFA.SOFA_Gesamt: reported-versus-derived status unresolved
    iSOFA.iSOFA_Gesamt: reported-versus-derived status unresolved
