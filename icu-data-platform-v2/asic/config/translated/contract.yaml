contract_version: '1.3'
dataset: asic_translated
expected_hospital_codes: [0, 2, 3, 4, 6, 7, 8]

producer:
  pooled_contract_version: '1.2'
  translation_policy_version: '1.3'
  compatible_generator_versions: ['0.6.3']
  documentation: asic/docs/pooled_to_translated.md

manifest:
  filename: translation_manifest.json
  artifact: asic_translated
  audit_status: pass
  required_checks:
    input_schemas_match_contract: true
    row_counts_preserved: true
    source_order_preserved: true
    translated_column_order_matches_registry: true
    stay_id_hid_and_time_values_preserved: true
    translated_names_unique: true
    approved_merge_conflict_policies_applied: true
    approved_categorical_value_mappings_applied: true
    unmapped_non_missing_values_in_approved_mappings: 0
    approved_categorical_missing_sentinels_normalized: true
    approved_numeric_missing_sentinels_normalized: true
    approved_hospital_specific_semantic_splits_applied: true
    semantic_split_source_values_preserved: true
    categorical_values_recoded: true
    unit_corrections_applied: false
    invalid_values_masked: false

identifiers:
  stay_id_column: stay_id_global
  canonical_hospital_id_column: hospital_id
  source_hospital_code_column: hospital_code_source

time:
  relative_time_column: minutes_since_icu_admission
  anchored_time_column: anchored_time_since_icu_admission

downstream:
  preserve_all_input_columns: true
  preserve_row_count_and_order: true
  preserve_identifiers_and_time_keys: true
  value_changes_require_approved_cleaning_rules: true

tables:
  static:
    filename: static.parquet
    columns:
      - name: stay_id_global
        arrow_type: {production: large_string, mock: string}
      - {name: hospital_id, arrow_type: string}
      - {name: hospital_code_source, arrow_type: double}
      - {name: cluster_id, arrow_type: int8}
      - {name: time_since_study_start, arrow_type: double}
      - name: study_implementation_phase
        arrow_type: {production: int8, mock: double}
      - {name: sex, arrow_type: large_string}
      - name: age_group
        arrow_type: {production: large_string, mock: string}
      - {name: weight_kg, arrow_type: double}
      - {name: height_cm, arrow_type: double}
      - {name: weight_group, arrow_type: large_string}
      - name: height_group
        arrow_type: {production: large_string, mock: string}
      - {name: bmi_group, arrow_type: large_string}
      - {name: hosp_los, arrow_type: double}
      - {name: icu_los, arrow_type: double}
      - {name: icu_readmit, arrow_type: double}
      - {name: discharge_status, arrow_type: large_string}
      - {name: death_status, arrow_type: large_string}
      - {name: hospital_mortality_reported, arrow_type: bool}
      - name: icd10_codes
        arrow_type: {production: large_string, mock: string}
      - {name: dialysis_free_days, arrow_type: double}
      - {name: vent_free_days, arrow_type: double}

  dynamic:
    filename: dynamic.parquet
