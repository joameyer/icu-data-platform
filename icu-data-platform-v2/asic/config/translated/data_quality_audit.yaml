# The hypotheses below were generated from the reviewed demo report. They are
# evaluated in memory only and are not approved transformations. Candidate
# profiles are evidence to review again on complete production data.
targeted_scale_audits:
  - id: uk03_fio2_fraction_to_percent_candidate
    column: fio2
    hospital: asic_UK03
    operation: multiply
    factor: 100
    expected_min: 20
    expected_max: 100
    evidence: Demo median 0.40 versus peer medians 35-43; multiplying by 100 puts the distribution on the percent scale.
    approval_status: hypothesis_only_not_approved
  - id: uk04_etco2_legacy_divisor_candidate
    column: etco2
    hospital: asic_UK04
    operation: divide
    factor: 7.50062
    expected_min: 0
    expected_max: 100
    evidence: Demo median 292.523 becomes 39.000 and matches peer medians 36-44 using the exact legacy divisor.
    approval_status: hypothesis_only_not_approved
  - id: uk03_norepinephrine_divide_100_candidate
    column: norepinephrine_iv_cont
    hospital: asic_UK03
    operation: divide
    factor: 100
    evidence: Demo median 5.556 becomes 0.05556 and aligns with peer medians 0.05-0.10.
    approval_status: hypothesis_only_not_approved
  - id: uk03_hematocrit_fraction_to_percent_candidate
    column: hematocrit
    hospital: asic_UK03
    operation: multiply
    factor: 100
    expected_min: 0
    expected_max: 80
    evidence: Demo median 0.235 versus peer medians 24-29 indicates a fraction-versus-percent scale.
    approval_status: hypothesis_only_not_approved
  - id: uk00_lymph_pct_fraction_to_percent_candidate
    column: lymph_pct
    hospital: asic_UK00
    operation: multiply
    factor: 100
    expected_min: 0
    expected_max: 100
    evidence: Demo median 0.1225 versus peer medians 6-10 indicates a fraction-versus-percent scale.
    approval_status: hypothesis_only_not_approved
  - id: uk08_albumin_peer_scale_candidate
    column: albumin
    hospital: asic_UK08
    operation: divide
    factor: 100
    peer_hospitals: [asic_UK00, asic_UK02, asic_UK03, asic_UK04, asic_UK07]
    evidence: Dividing by 100 is an empirical numerical-alignment probe only; it moves the demo median 29942.8 near selected peer medians 339-414, but source and target physical units are unconfirmed.
    approval_status: empirical_alignment_only_not_unit_conversion
  - id: uk03_d_dimer_peer_scale_candidate
    column: d_dimer
    hospital: asic_UK03
    operation: multiply
    factor: 1000
    peer_hospitals: [asic_UK00, asic_UK02, asic_UK07]
    evidence: Demo median 2.46 becomes 2460, within the broad peer raw-scale distribution; only 19 demo values are available.
    approval_status: hypothesis_only_not_approved
  - id: uk08_d_dimer_peer_scale_candidate
    column: d_dimer
    hospital: asic_UK08
    operation: multiply
    factor: 1000
    peer_hospitals: [asic_UK00, asic_UK02, asic_UK07]
    evidence: Demo median 6.61 becomes 6610, comparable with peer raw-scale medians 1535-5696.
    approval_status: hypothesis_only_not_approved
  - id: uk03_troponin_peer_scale_candidate
    column: troponin
    hospital: asic_UK03
    operation: divide
    factor: 1000
    evidence: Demo median 79.45 becomes 0.07945, comparable with peer raw-scale medians 0.042-0.21.
    approval_status: hypothesis_only_not_approved
  - id: uk06_vt_per_kg_mixed_scale_candidate
    column: vt_per_kg
    hospital: asic_UK06
    operation: divide_when_above
    factor: 1000
    threshold: 1000
    expected_min: 0
    expected_max: 30
    evidence: This source field did not exist in the legacy translation registry. In production it is exactly equal to vt_per_kg_ideal_body_weight on every both-present UK06 row. The legacy pipeline classified the latter field as having unrecoverable mixed scales and set the complete UK06 site/field pair missing; it did not approve or implement division by 1000. This thresholded candidate remains an exploratory audit only, not a proposed cleaning rule.
    approval_status: hypothesis_only_not_approved
  - id: uk06_vt_per_kg_ideal_body_weight_mixed_scale_candidate
    column: vt_per_kg_ideal_body_weight
    hospital: asic_UK06
    operation: divide_when_above
    factor: 1000
    threshold: 1000
    expected_min: 0
    expected_max: 30
    peer_hospitals: [asic_UK02, asic_UK03, asic_UK04, asic_UK07, asic_UK08]
    evidence: The legacy pipeline explicitly classified this UK06 field as having unrecoverable mixed scales and set the complete site/field pair missing. No divide-by-1000 recovery or post-conversion validation was documented. Production contains 55,344 values above 1000 and 434 values outside 0-30 even after the thresholded hypothetical conversion, so this remains an exploratory audit and the preserved legacy action is site-wide masking unless a new rule is explicitly approved. UK00 is excluded from peers because its source-labelled per-ideal-body-weight field has absolute-volume-like values inconsistent with that label.
    approval_status: hypothesis_only_not_approved

# These rules audit isolated row-level scale-entry errors within a hospital.
# A value is a recovery candidate only when the raw value is outside the
# inclusive recovery window and the explicitly transformed value falls inside
# it. Candidate values are reported but never written by this audit.
row_level_scale_entry_audits:
  - id: ph_art_divide_100_entry_error_candidate
    column: ph_art
    operation: divide
    factor: 100
    recovery_min: 6.8
    recovery_max: 7.8
    evidence: An isolated arterial pH such as 745 is outside the physiologic pH window while 745 divided by 100 is 7.45. The rule is row-level and must not be interpreted as a hospital-wide unit conversion.
    approval_status: audit_candidate_pending_demo_and_production_review

targeted_comparison_audits:
  - id: albumin_unit_review
    column: albumin
    reason: Peer raw medians are 339-414 while UK08 is 29943; canonical units must be established before correction.
    approval_status: unresolved_requires_production_review
  - id: d_dimer_unit_review
    column: d_dimer
    reason: Hospitals separate into approximately single-unit and thousand-unit scales.
    approval_status: unresolved_requires_production_review
  - id: troponin_unit_review
    column: troponin
    reason: UK03 is approximately 1000-fold above most peers and assays may use different reporting units.
    approval_status: unresolved_requires_production_review
  - id: sufentanil_definition_review
    column: sufentanil_iv_cont
    reason: UK00 median is 0.0005 versus 10-15 elsewhere; this may combine unit and weight-normalization differences.
    approval_status: unresolved_requires_metadata
  - id: propofol_definition_review
    column: propofol_iv_cont
    reason: UK08 median is 1.62 versus 100-300 elsewhere, suggesting different dose definitions.
    approval_status: unresolved_requires_metadata
  - id: ketanest_definition_review
    column: ketanest_iv_cont
    reason: UK08 median is 1.5 versus 100 at reporting peers, suggesting different dose definitions.
    approval_status: unresolved_requires_metadata
  - id: morphine_definition_review
    column: morphine_iv_cont
    reason: UK08 median is 35.3 while peers range from 0.4 to 10, without a confirmed common unit.
    approval_status: unresolved_requires_metadata
  - id: clonidine_mixed_scale_review
    column: clonidine_iv_cont
    reason: UK08 Q1 overlaps peer values but its median and upper quartile are much larger, so one multiplier may be unsafe.
    approval_status: unresolved_requires_distribution_review
  - id: vt_per_kg_definition_review
    column: vt_per_kg
    reason: UK06 has mixed scales and the relation to the ideal-body-weight field must be measured row by row.
    approval_status: unresolved_requires_row_relationship_review
  - id: vt_per_kg_ideal_body_weight_definition_review
    column: vt_per_kg_ideal_body_weight
    reason: UK00 values have been losslessly moved to vt_per_ideal_bw_total; the remaining field still includes the UK06 values that the legacy pipeline classified as unrecoverable mixed-scale, so source meaning must be verified by hospital.
    approval_status: unresolved_requires_row_relationship_review
  - id: vt_per_ideal_bw_total_definition_review
    column: vt_per_ideal_bw_total
    reason: UK00 values were separated because their scale is absolute-volume-like and nearly all equal 6 times predicted body weight, but their exact upstream provenance remains undocumented.
    approval_status: unresolved_requires_source_metadata
  - id: urea_unit_review
    column: urea
    reason: UK08 has a substantially higher demo median than peers; metadata or production evidence is required before inferring a unit conversion.
    approval_status: unresolved_requires_metadata_or_production_review
  - id: scvo2_definition_review
    column: scvo2
    reason: UK02 and UK07 have saturation distributions near arterial or peripheral oxygen saturation, while UK00 appears central-venous-like; row-level comparisons are required.
    approval_status: unresolved_requires_row_relationship_review

targeted_bucket_audits:
  - id: uk06_vt_per_kg_scale_buckets
    column: vt_per_kg
    hospital: asic_UK06
