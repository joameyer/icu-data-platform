    columns: [albumin]
    invalid_zero: true
    description: Albumin concentrations cannot be exactly zero.
  - legacy_name: cardiac_index_bolus
    columns: [cardiac_index_bolus]
    hard_min: 0
    hard_max: 15
    invalid_zero: true
    description: Cardiac index must be greater than 0 and at most 15 L/min/m2.
  - legacy_name: cardiac_index_cont
    columns: [cardiac_index_cont]
    hard_min: 0
    hard_max: 15
    invalid_zero: true
    description: Cardiac index must be greater than 0 and at most 15 L/min/m2.
  - legacy_name: cardiac_output_bolus
    columns: [cardiac_output_bolus]
    hard_min: 0
    hard_max: 25
    invalid_zero: true
    description: Cardiac output must be greater than 0 and at most 25 L/min.
  - legacy_name: cardiac_output_cont
    columns: [cardiac_output_cont]
    hard_min: 0
    hard_max: 25
    invalid_zero: true
    description: Cardiac output must be greater than 0 and at most 25 L/min.
  - legacy_name: compliance
