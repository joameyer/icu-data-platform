policy_version: '1.10'
status: approved_for_read_only_audit
translated_contract_version: '1.3'
documentation: asic/docs/cross_hospital_data_quality.md

scope:
  profile_every_numeric_translated_field: true
  profile_exclusions:
    static: [hospital_code_source, cluster_id]
    dynamic:
      - hospital_code_source
      - minutes_since_icu_admission
  hospital_column: hospital_id
  stay_id_column: stay_id_global

distribution_screen:
  # These reproduce the thresholds used by the legacy ASIC pipeline. Quantiles
  # are exact until the per-hospital/variable sample cap and deterministic
  # bottom-k estimates thereafter.
  minimum_non_missing_values: 20
  minimum_hospitals: 4
  hospital_metric_iqr_fence_factor: 1.5
  metrics: [min, median, iqr, max, range_width]
  additional_metrics: [finite_rate]

# Broad, read-only discovery of possible decimal-place or factor-entry errors.
# Every dynamic field with both a legacy hard minimum and maximum is scanned.
# Only raw out-of-range values are tested, and no candidate is written.
scale_entry_discovery:
  source: bounded_legacy_invalid_value_rules
  factors: [10, 100, 1000]
  minimum_finite_values_for_pattern: 20
  rare_candidate_max_fraction: 0.01
  systematic_candidate_min_fraction: 0.20

# Bounded second-pass evidence for review-selected, uniquely recoverable
# candidates in fields where temporal or same-row physiology can help a human
# reviewer.
# Known systematic site-wide findings remain in targeted_scale_audits instead.
candidate_context_audit:
  windows_hours: [1, 4, 8]
  maximum_candidate_rows: 100000
  fields:
    - column: core_temp
      excluded_hospitals: []
      related_fields: []
      relationship: none

    - column: evlwi
      excluded_hospitals: []
      related_fields: []
      relationship: none
    - column: ph_art
      excluded_hospitals: []
      related_fields: []
      relationship: none
    - column: fio2
      # UK03 is a known site-wide fraction-to-percent hypothesis, not an
      # isolated entry-error candidate.
      excluded_hospitals: [asic_UK03]
      related_fields: [fio2_set]
      relationship: compare_related_field
    - column: map
      excluded_hospitals: []
      related_fields: [sbp, dbp]
      relationship: map_from_sbp_dbp
    - column: spo2
      excluded_hospitals: []
      related_fields: [sao2]
      relationship: compare_related_field
    - column: sao2
      excluded_hospitals: []
      related_fields: [spo2]
      relationship: compare_related_field
    - column: scvo2
      excluded_hospitals: []
      # Existing relationship_audits compare ScvO2 separately with both SaO2
      # and SpO2; temporal context here does not choose either as equivalent.
      related_fields: []
      relationship: none

# Cross-table, read-only test of the hypothesis that UK00's source-labelled
# per-ideal-body-weight field is actually the absolute 6 mL/kg PBW target.
# PBW is a test formula, not confirmed source metadata, and no value is changed.
predicted_body_weight_tidal_volume_audit:
  id: uk00_ardsnet_pbw_tidal_volume_formula_review
  hospital: asic_UK00
  sex_column: sex
  height_column: height_cm
  actual_weight_column: weight_kg
  vt_column: vt
  vt_per_kg_column: vt_per_kg
  target_absolute_vt_column: vt_per_ideal_bw_total
  male_value: male
  female_value: female
  male_intercept_kg: 50.0
  female_intercept_kg: 45.5
  height_coefficient_kg_per_cm: 0.91
  height_center_cm: 152.4
  target_ml_per_kg_pbw: 6.0
  plausible_height_min_cm: 120.0
  plausible_height_max_cm: 220.0
  plausible_actual_weight_min_kg: 20.0
  plausible_actual_weight_max_kg: 300.0
  absolute_tolerance_ml: 0.01
  normalized_tolerance_ml_per_kg: 0.01
  approval_status: hypothesis_only_not_approved
  evidence: UK00's production median 412.476 mL equals 6 times ARDSNet PBW for a 173 cm male, and its maximum 587.196 mL equals 6 times PBW for a 205 cm male. Row-level static-to-dynamic testing is required before assigning this meaning.

legacy_sources:
  - file: hpc-icu-data-platform/src/icu_data_platform/sources/asic/qc/dynamic_checks.py
    symbols:
      - find_non_numeric_value_issues
      - numeric_distribution_summary
      - flag_cross_hospital_distribution_issues
  - file: hpc-icu-data-platform/src/icu_data_platform/sources/asic/harmonize/dynamic.py
    symbols:
      - SEMANTIC_TARGET_VARIABLES
      - INVALID_VALUE_RULES
      - apply_dynamic_semantic_harmonization
      - apply_dynamic_invalid_value_cleaning
  - file: hpc-icu-data-platform/src/icu_data_platform/sources/asic/harmonize/static.py
    symbols: [MINUS_ONE_TO_NA_COLUMNS]

legacy_coverage:
  invalid_value_rule_count: 44
  expanded_v2_invalid_value_check_count: 47
  targeted_semantic_finding_count: 5
  static_minus_one_sentinel_count: 6

legacy_raw_numeric_parsing:
  auditability_at_translated_boundary: unavailable_after_upstream_numeric_coercion
  hospital: asic_UK04
  missing_strings:
    - storniert
    - storno
    - kein material
    - falsches mater.
    - falsches mater
    - fal.volumen
    - geronnen
    - entfällt
    - entfaellt
    - folgt
  threshold_rules:
    less_than_value: 0
    greater_than_value: threshold_number
  decimal_comma_converted_to_decimal_point: true
  ie_ratio_parsing:
    accepted_separators: [':', '/']
    calculation: numerator_divided_by_denominator
    zero_denominator: missing
  requirement: >-
    The translated audit verifies numeric Arrow types, missing values, and
    infinities. It cannot reconstruct original strings that pooling or numeric
    coercion already discarded. Raw-value parsing must be re-audited upstream
    if the original hospital files become available.

legacy_static_minus_one_sentinels:
  - {column: weight_group, value: '-1', value_kind: string}
  - {column: hosp_los, value: -1, value_kind: numeric}
  - {column: icu_los, value: -1, value_kind: numeric}
  - {column: icu_readmit, value: -1, value_kind: numeric}
  - {column: dialysis_free_days, value: -1, value_kind: numeric}
  - {column: vent_free_days, value: -1, value_kind: numeric}

# These are the 44 rules from legacy INVALID_VALUE_RULES. A rule may map to
# more than one v2 field where the old pipeline had merged distinct sources.
legacy_invalid_value_rules:
