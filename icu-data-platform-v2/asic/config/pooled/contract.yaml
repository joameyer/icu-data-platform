contract_version: '1.2'
dataset: asic_pooled
expected_hospital_codes: [0, 2, 3, 4, 6, 7, 8]

identifiers:
  stay_id_column: Pseudo-ID
  hospital_id_column: hid

time:
  relative_time_column: Zeit_ab_Aufnahme
  anchored_time_column: timeidx

tables:
  static:
    filename: static.parquet
    columns:
      - name: Pseudo-ID
        arrow_type: {production: large_string, mock: string}
      - {name: Cluster-ID, arrow_type: int8}
      - {name: Zeit_seit_Studienbeginn, arrow_type: double}
      - name: Phase
        arrow_type: {production: int8, mock: double}
      - name: clusterGeschlecht
        arrow_type: {production: large_string, mock: string}
      - name: clusterKoerpergewicht
        arrow_type: {production: large_string, mock: string}
      - name: clusterKoerpergroesse
        arrow_type: {production: large_string, mock: string}
      - name: BMI
        arrow_type: {production: large_string, mock: string}
      - {name: Liegedauer_KH, arrow_type: double}
      - {name: Liegedauer_ICU, arrow_type: double}
      - {name: Wiederaufnahme_ICU, arrow_type: double}
      - name: clusterAlter
        arrow_type: {production: large_string, mock: string}
      - name: 'Entlassgrund_(verlegt_intern,_verlegt_extern,_verstorben)'
        arrow_type: {production: large_string, mock: string}
      - name: Sterblichkeit
        arrow_type: {production: large_string, mock: string}
      - name: ICD-10_Codes
        arrow_type: {production: large_string, mock: string}
      - {name: weightKg, arrow_type: double}
      - {name: heightcm, arrow_type: double}
