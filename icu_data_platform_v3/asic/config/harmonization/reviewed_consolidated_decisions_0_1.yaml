approved_hospital_conversions:
  - decision_id: UK04-ETCO2-PA-TO-MMHG
    hospital: asic_UK04
    table: dynamic
    variable: etco2
    operation: divide
    factor: 7.50062
    output_unit: mmHg
  - decision_id: UK03-FIO2-FRACTION-TO-PERCENT
    hospital: asic_UK03
    table: dynamic
    variable: fio2
    operation: multiply
    factor: 100
    output_unit: percent
  - decision_id: UK03-HEMATOCRIT-FRACTION-TO-PERCENT
    hospital: asic_UK03
    table: dynamic
    variable: hematocrit
    operation: multiply
    factor: 100
    output_unit: percent
  - decision_id: UK00-LYMPH-FRACTION-TO-PERCENT
    hospital: asic_UK00
    table: dynamic
    variable: lymph_pct
    operation: multiply
    factor: 100
    output_unit: percent

unresolved_unit_policy:
  action: preserve_value_without_conversion
  unit: unresolved
  analysis_eligible: false
  distribution_alignment_is_not_unit_evidence: true
  applies_to_all_numeric_variables_not_listed_under_approved_units: true

analysis_restrictions:
  - variables: [ie_ratio, ie_ratio_set]
    scope: all_hospitals
    analysis_eligible: false
    reason: ratio_direction_i_to_e_versus_e_to_i_unresolved
  - variables: [vt_per_kg, vt_per_kg_ideal_body_weight]
    scope: [asic_UK06]
    analysis_eligible: false
    reason: mixed_scale_requires_cleaned_layer_policy

semantic_decisions:
  driving_pressure:
    decision: keep_reported_and_future_computed_variables_separate
    source_backed_harmonized_variable: delta_p_reported
    future_derived_variable: delta_p_computed
  sofa_and_isofa:
    decision: preserve_reported_calculated_and_isofa_variables_separately
    floating_point_component_sum_tolerance: 1.0e-12
  oxygen_saturations:
    decision: keep_scvo2_sao2_and_spo2_separate
  free_day_variables:
    decision: keep_dialysis_free_days_and_vent_free_days_separate
  uk00_tidal_volume_semantic_split:
    decision: keep_separate
    variable: vt_per_ideal_bw_total
    unit: mL
    must_not_merge_with: [vt, vt_per_kg_ideal_body_weight]

cleaning_boundary:
  invalid_range_variable_decisions: 42
  row_level_scale_rule_decisions: 1
  action: defer_all_to_cleaned_layer
  apply_physiologic_masking_during_harmonization: false
  apply_row_level_power_of_ten_correction_during_harmonization: false

globally_all_missing_columns:
  action: preserve_with_explicit_all_missing_dictionary_flag
  variables:
    - feo2
    - severity_read_confirmation
    - sofa_score_without_gcs
    - stroke_volume_bolus

remaining_human_gates:
  categorical_domain_contract: pending
  ordered_union_schema_freeze: pending
  variable_dictionary_freeze: pending
  release_publication: pending
