# These decisions predate the consolidated numeric-unit audit and must not be
# lost merely because they were outside that audit's numeric review rows.
reviewed_representation_overrides:
  static:
    height_cm:
      unit: cm
      analysis_eligibility: eligible
      caveat: scalar_source_height_kept_separate_from_uk00_repeated_height_list
    hospital_code_source:
      unit: dimensionless_code
      analysis_eligibility: eligible
      caveat: source_hospital_code_not_the_canonical_hospital_identifier
  dynamic:
    hospital_code_source:
      unit: dimensionless_code
      analysis_eligibility: eligible
      caveat: source_hospital_code_not_the_canonical_hospital_identifier

# The raw-v3 export has relative minutes but no raw `timeidx` occurrence. Keep
# the already reviewed artificial time representation as a deterministic
# harmonized output rather than pretending that it was source-backed.
reviewed_generated_outputs:
  dynamic:
    anchored_time_since_icu_admission:
      insert_after: minutes_since_icu_admission
      physical_type: timestamp[ns]
      unit: artificial_anchored_timestamp
      analysis_eligibility: eligible
      definition: Artificial timestamp equal to 2020-01-01 00:00:00 plus minutes_since_icu_admission; it is not a real calendar event time.
      caveat: artificial_anchor_preserves_relative_time_only_not_calendar_time
      source_variable: minutes_since_icu_admission
      operation: anchor_plus_minutes
      anchor: '2020-01-01 00:00:00'

review_boundary:
  read_candidate_data: false
  rescan_clinical_rows: false
  modify_candidate_data: false
  freeze_schema_automatically: false
  freeze_dictionary_automatically: false
  write_harmonized_data: false
  publish_data: false

reporting:
