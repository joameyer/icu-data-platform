# These value mappings were reviewed only at the lossy v2 boundary. They are
# surfaced as raw-v3 candidates and never applied by this review command.
categorical_value_candidates:
  static:
    sex:
      review_status: frozen_v2_candidate_requires_raw_v3_review
      normalization: strip_upper
      values: {M: male, W: female}
    weight_group:
      review_status: frozen_v2_candidate_requires_raw_v3_review
      normalization: strip
      values: {'<65': '<65', '65-75': '65-75', '76-250': '76-250', '-1': null}
    bmi_group:
      review_status: frozen_v2_candidate_requires_raw_v3_review
      normalization: strip_upper
      values:
        {L: underweight, M: normal_weight, P: overweight,
         '1': obesity_class_1, '2': obesity_class_2, '3': obesity_class_3,
         X: null, NAN: null}
    discharge_status:
      review_status: frozen_v2_candidate_requires_raw_v3_review
      normalization: strip_lower
      values: {verlegt: transferred, verstorben: died}
    death_status:
      review_status: frozen_v2_candidate_requires_raw_v3_review
      normalization: strip_upper
      values: {'0': discharged_alive, ICU: died_in_icu, KH: died_in_hospital, NAN: null}
    hospital_mortality_reported:
      review_status: frozen_v2_candidate_requires_raw_v3_review
      normalization: strip_lower
      values: {'false': false, 'true': true}
    icu_readmit:
      review_status: human_approved_raw_v3_cross_hospital_domain
      normalization: strip
      values: {'0': false, '0.0': false, '1': true, '1.0': true}
    study_implementation_phase:
      review_status: human_approved_raw_v3_cross_hospital_domain
      normalization: strip
      values:
        {'0': calibration, '0.0': calibration,
         '1': roll_in, '1.0': roll_in,
         '2': app_implementation, '2.0': app_implementation}
  dynamic:
    therapy_read_confirmation_utc:
      review_status: human_approved_raw_v3_cross_hospital_domain
      normalization: integral_binary_numeric
      values: {'0': false, '1': true}

