      allowed_layouts:
        - column_count: 125
          one_based_positions: [122, 123]
        - column_count: 127
          one_based_positions: [110, 125]
      ingestion_action: preserve_as_separate_positional_source_columns
      translation_action: drop_second_only_if_all_empty_revalidated
      evidence:
        anomaly_audit_artifact_version: '0.1'
        input_inventory_run_id: 20260804T175134Z
        audited_file_count: 3676
        audited_record_count: 7267221
        second_occurrence_nonempty_count: 0

  provisional_archive_exclusions:
    - rule_id: uk00_control_export_archive
      approval_status: provisional_pending_owner_confirmation
      hospital_folder: '00'
      expected_size_bytes: 290741496
