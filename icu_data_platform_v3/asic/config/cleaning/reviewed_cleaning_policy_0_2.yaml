priority_rules:
  - id: C02-ALBUMIN
    variable: albumin
    action: mask_outside_open_closed_range
    hard_min_exclusive: 0.0
    hard_max_inclusive: 1000.0
    unit: dg_per_L
    rationale: >-
      Exact zero is a reviewed missing sentinel. The broad 1000 dg/L ceiling
      catches newly exposed values on the 6695-68613 dg/L scale without
      treating the ordinary clinical reference interval as a cleaning bound.

  - id: C02-CREATININE
    variable: creatinine
    action: mask_nonpositive_preserve_positive_extremes
    hard_min_exclusive: 0.0
    unit: umol_per_L
    rationale: Exact zero is a reviewed missing sentinel; no defensible hard positive ceiling is activated.

  - id: C02-EVLWI
    variable: evlwi
    action: recover_unique_power_of_ten_else_mask_outside_open_closed_range
    hard_min_exclusive: 0.0
    hard_max_inclusive: 80.0
    unit: mL_per_kg
    factors: [0.001, 0.01, 0.1, 10.0, 100.0, 1000.0]
    rationale: >-
      Correct only an out-of-range value having exactly one reviewed
      power-of-ten result in range; mask ambiguous or unrecoverable values.

  - id: C02-GEDVI
    variable: gedvi
    action: mask_nonpositive_preserve_above_review_threshold
    hard_min_exclusive: 0.0
    review_threshold: 2000.0
    unit: mL_per_m2
    rationale: Positive values above 2000 are extreme but do not establish a deterministic scale error.

  - id: C02-HEMOGLOBIN
    variable: hemoglobin
    action: mask_outside_open_closed_range
    hard_min_exclusive: 0.0
    hard_max_inclusive: 25.0
    unit: mmol_per_L
    rationale: Zero and values above the deliberately broad ceiling are invalid for cleaned analysis input.

  - id: C02-INR
    variable: inr
    action: mask_nonpositive_preserve_above_review_threshold
    hard_min_exclusive: 0.0
    review_threshold: 15.0
    unit: dimensionless_ratio
    rationale: Positive high INR values are retained because range evidence does not prove an input or unit error.

  - id: C02-LACTATE-ART
    variable: lactate_art
    action: mask_nonpositive_preserve_above_review_threshold
    hard_min_exclusive: 0.0
    review_threshold: 30.0
    unit: mmol_per_L
    rationale: Negative and exact-zero values are invalid; positive severe values are retained and audited.

  - id: C02-PLATELETS
    variable: platelets
    action: mask_outside_open_closed_range
    hard_min_exclusive: 0.0
    hard_max_inclusive: 2000.0
    unit: 10e9_per_L
    rationale: The cross-hospital exact-zero pattern is a reviewed missing sentinel.

  - id: C02-PTT
    variable: ptt
    action: mask_nonpositive_preserve_above_review_threshold
    hard_min_exclusive: 0.0
    review_threshold: 300.0
    unit: s
    rationale: Positive prolonged measurements are retained because no deterministic input error is established.

  - id: C02-SOFA-UNSPECIFIED
    variable: sofa_score_unspecified
    action: require_integer_closed_range
    hard_min_inclusive: 0.0
    hard_max_inclusive: 24.0
    integer_tolerance: 1.0e-9
    unit: score_point
    rationale: Full SOFA is the sum of six 0-4 component scores.

  - id: C02-SOFA-WITHOUT-GCS
    variable: sofa_score_without_gcs
    action: require_integer_closed_range
    hard_min_inclusive: 0.0
    hard_max_inclusive: 20.0
    integer_tolerance: 1.0e-9
    unit: score_point
    rationale: The all-missing field is retained; a future value excludes the 0-4 GCS component.

  - id: C02-SVRI
    variable: svri
    action: mask_nonpositive_preserve_above_review_threshold
    hard_min_exclusive: 0.0
    review_threshold: 10000.0
    unit: dyn_s_cm5_m2
    rationale: The smooth positive upper tail does not resemble a decimal-placement or unit error.

