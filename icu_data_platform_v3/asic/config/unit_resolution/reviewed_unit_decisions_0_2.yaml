# These rules route one hospital's source representation into a parallel
# harmonized variable. The ordinary canonical variable is unavailable for that
# hospital rather than populated with a value having a different definition.
# No value is removed in cleaning.
semantic_splits:
  - decision_id: UK08-CLONIDINE-WEIGHT-NORMALIZED-SPLIT
    evidence_decision_id: UK08-CLONIDINE-UNRECOVERABLE-NORMALIZATION
    hospital: asic_UK08
    source_variable: clonidine_iv_cont
    canonical_variable: clonidine_iv_cont
    target_variable: clonidine_iv_cont_weight_normalized
    description: Continuous intravenous clonidine dose rate normalized by body weight
    target_value_type: float64
    target_unit: ug_per_kg_per_h
