# These are proposed harmonization actions. They are not executable until the
# complete candidate and its row-level audit have been explicitly approved.
hospital_harmonization_actions:
  - {decision_id: UK08-ALBUMIN-MG-L-TO-DG-L, hospital: asic_UK08, variable: albumin, action: multiply, factor: 0.01, source_unit: mg_per_L, target_unit: dg_per_L, confidence: high, evidence: "UK08 median 28889.55 mg/L becomes 288.8955 dg/L, aligning with the 350-497 dg/L peer scale."}
  - {decision_id: UK03-D-DIMER-UG-ML-TO-NG-ML, hospital: asic_UK03, variable: d_dimer, action: multiply, factor: 1000.0, source_unit: ug_per_mL, target_unit: ng_per_mL, confidence: moderate, evidence: "UK03 median 8.76 becomes 8760 ng/mL on the peer scale; FEU/DDU remains explicitly unspecified."}
  - {decision_id: UK08-D-DIMER-UG-ML-TO-NG-ML, hospital: asic_UK08, variable: d_dimer, action: multiply, factor: 1000.0, source_unit: ug_per_mL, target_unit: ng_per_mL, confidence: moderate, evidence: "UK08 median 3.695 becomes 3695 ng/mL on the peer scale; FEU/DDU remains explicitly unspecified."}
  - {decision_id: UK03-TROPONIN-NG-L-TO-NG-ML, hospital: asic_UK03, variable: troponin, action: multiply, factor: 0.001, source_unit: ng_per_L, target_unit: ng_per_mL, confidence: high, evidence: "UK03 median 96 ng/L becomes 0.096 ng/mL, matching peer medians 0.054-0.185 ng/mL."}
  - {decision_id: UK08-UREA-BUN-MG-DL-TO-MMOL-L, hospital: asic_UK08, variable: urea, action: divide, factor: 2.8, source_unit: BUN_mg_per_dL, target_unit: mmol_per_L, confidence: high, evidence: "UK08 median 26.8 mg/dL BUN becomes 9.57 mmol/L, matching peer medians 6.85-9.6 mmol/L and the prior ASIC conversion configuration."}
  - {decision_id: UK08-ISOFLURANE-HUNDREDTHS-TO-VOL-PERCENT, hospital: asic_UK08, variable: isoflurane_inh, action: multiply, factor: 0.01, source_unit: volume_percent_times_100, target_unit: volume_percent, confidence: moderate, evidence: "UK08 median 60 becomes 0.60 vol%; UK07 is already on a plausible 2.3 vol% scale."}
  - {decision_id: UK03-FUROSEMIDE-MG-DAY-TO-MG-H, hospital: asic_UK03, variable: furosemide_iv_cont, action: divide, factor: 24.0, source_unit: mg_per_day, target_unit: mg_per_h, confidence: moderate, evidence: "UK03 median 160 mg/day becomes 6.67 mg/h, aligning with peer continuous-infusion medians 4-20 mg/h."}
  - {decision_id: UK08-VASOPRESSIN-IU-H-TO-IU-MIN, hospital: asic_UK08, variable: vasopressin_iv_cont, action: divide, factor: 60.0, source_unit: IU_per_h, target_unit: IU_per_min, confidence: moderate, evidence: "UK08 median 0.8 IU/h becomes 0.0133 IU/min, near peer 0.02 IU/min."}
  - decision_id: UK00-VASOPRESSIN-IU-KG-MIN-TO-IU-MIN
    hospital: asic_UK00
    variable: vasopressin_iv_cont
    action: multiply_by_static_weight_kg
    factor: 1.0
    source_unit: IU_per_kg_per_min
    target_unit: IU_per_min
    confidence: moderate
    evidence: "UK00 median 0.0003115 IU/kg/min maps to the peer IU/min scale for ordinary adult weights. Activation requires exact stay linkage and weight coverage audit."
    missing_or_invalid_weight_action: set_missing_and_flag

# These site-variable definitions cannot be recovered with the variables
# available at the affected hospital. They are proposed for cleaned-layer
# masking after the common unit is assigned to the remaining hospitals.
hospital_cleaning_masks:
  - {decision_id: UK08-CLONIDINE-UNRECOVERABLE-NORMALIZATION, hospital: asic_UK08, variable: clonidine_iv_cont, reason: "Likely weight-normalized versus peer absolute mg/h representation; actual patient weight is unavailable at UK08."}
  - {decision_id: UK03-EPINEPHRINE-UNRECOVERABLE-NORMALIZATION, hospital: asic_UK03, variable: epinephrine_iv_cont, reason: "Likely absolute µg/min versus peer µg/kg/min representation; actual patient weight is unavailable at UK03."}
  - {decision_id: UK08-HYDROCORTISONE-UNRECOVERABLE-DEFINITION, hospital: asic_UK08, variable: hydrocortisone_iv_bolus, reason: "Observed 8.4-scale is inconsistent with peer bolus mg values and no unique source definition can be reconstructed."}
  - {decision_id: UK08-KETANEST-UNRECOVERABLE-NORMALIZATION, hospital: asic_UK08, variable: ketanest_iv_cont, reason: "Likely mg/kg/h versus peer mg/h representation; actual patient weight is unavailable at UK08."}
  - {decision_id: UK08-MORPHINE-UNRECOVERABLE-NORMALIZATION, hospital: asic_UK08, variable: morphine_iv_cont, reason: "Likely µg/kg/h versus peer mg/h representation; actual patient weight is unavailable at UK08."}
  - {decision_id: UK03-NOREPINEPHRINE-UNRECOVERABLE-NORMALIZATION, hospital: asic_UK03, variable: norepinephrine_iv_cont, reason: "Likely absolute µg/min versus peer µg/kg/min representation; actual patient weight is unavailable at UK03."}
  - {decision_id: UK02-PREDNISOLONE-UNRECOVERABLE-NORMALIZATION, hospital: asic_UK02, variable: prednisolone_iv_bolus, reason: "Likely weight-normalized source versus peer bolus mg representation; actual patient weight is unavailable at UK02."}
  - {decision_id: UK08-PROPOFOL-UNRECOVERABLE-NORMALIZATION, hospital: asic_UK08, variable: propofol_iv_cont, reason: "Likely mg/kg/h versus peer mg/h representation; actual patient weight is unavailable at UK08."}
  - {decision_id: UK00-SUFENTANIL-UNRECOVERABLE-NORMALIZATION, hospital: asic_UK00, variable: sufentanil_iv_cont, reason: "The 0.0005 scale could combine mass, weight, and time normalization; the exact time denominator is not recoverable with sufficient confidence."}

