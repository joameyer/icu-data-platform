[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asic-pipeline"
version = "0.1.0"
description = "Provenance-preserving ASIC and MIMIC-IV ICU data pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=14",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
asic-pipeline = "asic_pipeline.cli:main"
mimic-iv-pipeline = "mimic_iv_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
